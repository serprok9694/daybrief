<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Important email widget</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./daybrief.css">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700&display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div class="{{rootCls}}" style="{{rootStyle}}">
  <section class="card w" style="height:100%" aria-labelledby="ml-h">
    <div class="wh">
      <span class="wi"><svg class="ic ic-lg" viewBox="0 0 24 24" aria-hidden="true"><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg></span>
      <h2 class="wt" id="ml-h">{{t.title}}</h2>
      <sc-if value="{{hasMeta}}"><span class="wm">{{t.updated}}</span></sc-if>
      <sc-if value="{{hasMeta}}"><button class="ib {{spinCls}}" aria-label="{{t.refresh}}"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></svg></button></sc-if>
    </div>

    <sc-if value="{{isData}}" hint-placeholder-val="{{ true }}">
      <ul class="wl">
        <sc-for list="{{mails}}" as="m" hint-placeholder-count="3">
          <li>
            <a class="li" href="#">
              <span class="av av-sm {{m.av}}" aria-hidden="true">{{m.ini}}</span>
              <div class="li-body">
                <div class="mail-top"><span class="li-t ell">{{m.from}}</span><span class="wm">{{m.time}}</span></div>
                <div class="li-s ell" style="color:var(--ink);font-weight:500">{{m.subject}}</div>
                <div class="li-s clamp2" style="margin-top:2px">{{m.gist}}</div>
                <sc-if value="{{m.reply}}">
                  <div class="mail-foot"><span class="chip chip-a"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 20v-7a4 4 0 0 0-4-4H4"/><path d="M9 14 4 9l5-5"/></svg>{{t.needs}}</span></div>
                </sc-if>
              </div>
              <svg class="ic open" viewBox="0 0 24 24" role="img" aria-label="{{t.open}}"><path d="M7 7h10v10"/><path d="M7 17 17 7"/></svg>
            </a>
          </li>
        </sc-for>
      </ul>
    </sc-if>

    <sc-if value="{{isLoading}}" hint-placeholder-val="{{ false }}">
      <div style="display:flex;flex-direction:column;gap:22px;padding:6px 12px" aria-busy="true" aria-label="{{t.loading}}">
        <sc-for list="{{skRows}}" as="r" hint-placeholder-count="3">
          <div style="display:flex;gap:12px;align-items:flex-start">
            <span class="sk sk-c" style="width:40px;height:40px"></span>
            <div style="flex:1;display:flex;flex-direction:column;gap:8px"><span class="sk" style="height:14px;width:42%"></span><span class="sk" style="height:14px;width:{{r.w}}"></span><span class="sk" style="height:12px;width:84%"></span></div>
          </div>
        </sc-for>
      </div>
    </sc-if>

    <sc-if value="{{isEmpty}}" hint-placeholder-val="{{ false }}">
      <div class="emp">
        <span class="emp-i"><svg class="ic ic-xl" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg></span>
        <p class="emp-t">{{t.emptyT}}</p>
      </div>
    </sc-if>

    <sc-if value="{{isError}}" hint-placeholder-val="{{ false }}">
      <div class="emp">
        <span class="emp-i"><svg class="ic ic-xl" viewBox="0 0 24 24" aria-hidden="true"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg></span>
        <p class="emp-t">{{t.errT}}</p>
        <p class="emp-s">{{t.errS}}</p>
        <button class="btn btn-s btn-sm"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></svg>{{t.retry}}</button>
      </div>
    </sc-if>

    <sc-if value="{{isOff}}" hint-placeholder-val="{{ false }}">
      <div class="emp">
        <span class="emp-i"><svg class="ic ic-xl" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 22v-5"/><path d="M9 8V2"/><path d="M15 8V2"/><path d="M18 8v5a4 4 0 0 1-4 4h-4a4 4 0 0 1-4-4V8Z"/></svg></span>
        <p class="emp-t">{{t.offT}}</p>
        <p class="emp-s">{{t.offS}}</p>
        <button class="btn btn-p" style="margin-top:6px"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>{{t.offCta}}</button>
        <p class="emp-s" style="display:flex;align-items:center;gap:6px;margin-top:4px"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect width="18" height="11" x="3" y="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>{{t.offNote}}</p>
      </div>
    </sc-if>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"lang":{"editor":"enum","options":["en","ru"],"default":"en"},"status":{"editor":"enum","options":["data","loading","empty","error","off"],"default":"data"},"lite":{"editor":"boolean","default":false},"stage":{"editor":"boolean","default":true},"$preview":{"width":468,"height":560}}'>
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    const lang = p.lang === 'ru' ? 'ru' : 'en';
    const theme = p.theme === 'dark' ? 'dark' : 'light';
    const stage = p.stage !== false;
    const status = ['loading', 'empty', 'error', 'off'].includes(p.status) ? p.status : 'data';
    const T = {
      en: {
        title: 'Important emails', updated: 'Updated 2 min ago', refresh: 'Refresh emails', loading: 'Loading emails',
        needs: 'Needs reply', open: 'Open in Gmail',
        emptyT: 'Nothing important',
        errT: 'Couldn’t refresh', errS: 'Check your connection and try again.', retry: 'Try again',
        offT: 'Connect your email', offS: 'daybrief picks out the emails that matter and writes a short summary of each.',
        offCta: 'Connect email', offNote: 'Read-only. We never store message bodies.',
        mails: [
          { av: 'av1', ini: 'AK', from: 'Anna Kowalska', time: '08:12', subject: 'Design review: updated flows', gist: 'Asks you to confirm the revised onboarding flow before the 10:00 review.', reply: true },
          { av: 'av2', ini: 'AT', from: 'Accounting team', time: '07:48', subject: 'October VAT summary is ready', gist: 'Documents are uploaded; your sign-off is needed by Friday.', reply: true },
          { av: 'av4', ini: 'MN', from: 'Marek Nowak', time: 'Yesterday', subject: 'Venue options for Saturday', gist: 'Three venues with prices. No decision needed yet.', reply: false }
        ]
      },
      ru: {
        title: 'Важные письма', updated: 'Обновлено 2 мин назад', refresh: 'Обновить письма', loading: 'Загружаю письма',
        needs: 'Нужен ответ', open: 'Открыть в Gmail',
        emptyT: 'Ничего важного',
        errT: 'Не удалось обновить', errS: 'Проверь соединение и попробуй ещё раз.', retry: 'Повторить',
        offT: 'Подключить почту', offS: 'daybrief выберет важные письма и коротко перескажет каждое.',
        offCta: 'Подключить почту', offNote: 'Только чтение. Тела писем не храним.',
        mails: [
          { av: 'av1', ini: 'АК', from: 'Анна Ковальская', time: '08:12', subject: 'Дизайн-ревью: обновлённые флоу', gist: 'Просит подтвердить новый онбординг до ревью в 10:00.', reply: true },
          { av: 'av2', ini: 'БУ', from: 'Бухгалтерия', time: '07:48', subject: 'Сводка по НДС за октябрь готова', gist: 'Документы загружены; подпись нужна до пятницы.', reply: true },
          { av: 'av4', ini: 'МН', from: 'Марек Новак', time: 'Вчера', subject: 'Варианты места на субботу', gist: 'Три места с ценами. Решение пока не нужно.', reply: false }
        ]
      }
    }[lang];
    return {
      t: T, mails: T.mails,
      skRows: [{ w: '78%' }, { w: '64%' }, { w: '72%' }],
      isData: status === 'data', isLoading: status === 'loading', isEmpty: status === 'empty', isError: status === 'error', isOff: status === 'off',
      hasMeta: status !== 'off',
      spinCls: status === 'loading' ? 'spin' : '',
      rootCls: 'dbf th-' + theme + (p.lite === true ? ' lite' : '') + (stage ? ' scn sc-morning' : ''),
      rootStyle: stage ? 'padding:24px' : 'height:100%'
    };
  }
}
</script>
</body>
</html>
