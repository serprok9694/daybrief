<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sign in</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./daybrief.css">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700&display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div class="dbf th-{{theme}} scn sc-{{bg}}" style="width:1440px;height:900px;display:flex;flex-direction:column;padding:24px 40px">
  <div style="display:flex;justify-content:space-between;align-items:center">
    <div style="display:flex;align-items:center;gap:10px">
      <span class="orb" style="width:28px;height:28px" aria-hidden="true"></span>
      <span style="font-size:20px;line-height:28px;font-weight:700;letter-spacing:-.01em">daybrief</span>
    </div>
    <div class="glass seg" role="group" aria-label="{{t.langLabel}}" style="border-radius:999px;background:var(--sheet-bg)">
      <button aria-pressed="{{enOn}}"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"/><path d="M2 12h20"/></svg>EN</button>
      <button aria-pressed="{{ruOn}}">RU</button>
    </div>
  </div>

  <div style="flex:1;display:grid;place-items:center">
    <main class="glass" style="width:520px;max-width:100%;border-radius:40px;padding:52px 48px 40px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:20px">
      <span class="orb" style="width:64px;height:64px" aria-hidden="true"></span>
      <h1 style="font-size:36px;line-height:44px;font-weight:700;letter-spacing:-.02em;text-wrap:balance">{{t.h1}}</h1>
      <p style="font-size:16px;line-height:25px;color:var(--ink-2);max-width:380px;text-wrap:pretty">{{t.sub}}</p>
      <a class="btn btn-p" href="Main.dc.html" style="height:56px;width:100%;font-size:16px;gap:12px;margin-top:8px">
        <span style="width:28px;height:28px;border-radius:8px;background:#FFFFFF;display:grid;place-items:center">
          <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path fill="#4285F4" d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844a4.14 4.14 0 0 1-1.796 2.716v2.259h2.908c1.702-1.567 2.684-3.875 2.684-6.615z"/><path fill="#34A853" d="M9 18c2.43 0 4.467-.806 5.956-2.18l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 0 0 9 18z"/><path fill="#FBBC05" d="M3.964 10.71A5.41 5.41 0 0 1 3.682 9c0-.593.102-1.17.282-1.71V4.958H.957A8.996 8.996 0 0 0 0 9c0 1.452.348 2.827.957 4.042l3.007-2.332z"/><path fill="#EA4335" d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 0 0 .957 4.958L3.964 7.29C4.672 5.163 6.656 3.58 9 3.58z"/></svg>
        </span>
        {{t.cta}}
      </a>
      <ul style="display:flex;flex-direction:column;gap:12px;text-align:left;width:100%;margin-top:8px;padding-top:20px;border-top:1px solid var(--line)">
        <sc-for list="{{points}}" as="pt" hint-placeholder-count="3">
          <li style="display:flex;gap:12px;align-items:flex-start;font-size:14px;line-height:20px;color:var(--ink-2)">
            <svg class="ic" viewBox="0 0 24 24" style="margin-top:2px;color:var(--ink)" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>
            <span>{{pt}}</span>
          </li>
        </sc-for>
      </ul>
    </main>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"lang":{"editor":"enum","options":["en","ru"],"default":"en"},"bg":{"editor":"enum","options":["morning","day","evening","night"],"default":"morning"},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    const lang = p.lang === 'ru' ? 'ru' : 'en';
    const theme = p.theme === 'dark' ? 'dark' : 'light';
    const bg = ['morning', 'day', 'evening', 'night'].includes(p.bg) ? p.bg : 'morning';
    const T = {
      en: {
        langLabel: 'Language',
        h1: 'Your whole day in ten seconds',
        sub: 'Meetings, tasks, the emails that matter and one idea worth returning to — in a single calm view.',
        cta: 'Sign in with Google',
        points: ['Calendar and tasks are read-only. daybrief never changes your Google data.', 'Email is connected later, separately, only if you choose to.', 'We never store the text of your emails.']
      },
      ru: {
        langLabel: 'Язык',
        h1: 'Весь твой день за десять секунд',
        sub: 'Встречи, задачи, важные письма и одна идея, к которой стоит вернуться, — в одном спокойном экране.',
        cta: 'Войти через Google',
        points: ['Календарь и задачи только для чтения. daybrief не меняет твои данные в Google.', 'Почта подключается позже и отдельно, только если ты этого захочешь.', 'Тексты писем мы не храним.']
      }
    }[lang];
    return { theme, bg, t: T, points: T.points, enOn: lang === 'en', ruOn: lang === 'ru' };
  }
}
</script>
</body>
</html>
