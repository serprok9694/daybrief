<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Idea of the day widget</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./daybrief.css">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700&display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div class="{{rootCls}}" style="{{rootStyle}}">
  <section class="card w" style="height:100%" aria-labelledby="id-h">
    <div class="wh">
      <span class="wi"><svg class="ic ic-lg" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5"/><path d="M9 18h6"/><path d="M10 22h4"/></svg></span>
      <h2 class="wt" id="id-h">{{t.title}}</h2>
      <sc-if value="{{isData}}"><span class="wm">{{t.meta}}</span></sc-if>
      <button class="ib {{spinCls}}" aria-label="{{t.refresh}}"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></svg></button>
    </div>

    <sc-if value="{{isData}}" hint-placeholder-val="{{ true }}">
      <div class="idea-row">
        <div class="idea-body">
          <p class="idea-t">{{t.idea}}</p>
          <p class="sugg"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M9.937 15.5A2 2 0 0 0 8.5 14.063l-6.135-1.582a.5.5 0 0 1 0-.962L8.5 9.936A2 2 0 0 0 9.937 8.5l1.582-6.135a.5.5 0 0 1 .963 0L14.063 8.5A2 2 0 0 0 15.5 9.937l6.135 1.581a.5.5 0 0 1 0 .964L15.5 14.063a2 2 0 0 0-1.437 1.437l-1.582 6.135a.5.5 0 0 1-.963 0z"/></svg><span>{{t.sugg}}</span></p>
        </div>
        <div class="idea-act">
          <button class="btn btn-s">{{t.later}}</button>
          <button class="btn btn-p"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>{{t.done}}</button>
        </div>
      </div>
    </sc-if>

    <sc-if value="{{isLoading}}" hint-placeholder-val="{{ false }}">
      <div style="display:flex;flex-direction:column;gap:12px;padding:4px 0" aria-busy="true" aria-label="{{t.loading}}">
        <span class="sk" style="height:26px;width:70%"></span>
        <span class="sk" style="height:44px;width:100%;border-radius:16px"></span>
      </div>
    </sc-if>

    <sc-if value="{{isEmpty}}" hint-placeholder-val="{{ false }}">
      <div class="emp">
        <span class="emp-i"><svg class="ic ic-xl" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5"/><path d="M9 18h6"/><path d="M10 22h4"/></svg></span>
        <p class="emp-t">{{t.emptyT}}</p>
        <p class="emp-s">{{t.emptyS}}</p>
      </div>
    </sc-if>

    <sc-if value="{{isError}}" hint-placeholder-val="{{ false }}">
      <div class="emp">
        <span class="emp-i"><svg class="ic ic-xl" viewBox="0 0 24 24" aria-hidden="true"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg></span>
        <p class="emp-t">{{t.errT}}</p>
        <p class="emp-s">{{t.errS}}</p>
        <button class="btn btn-s btn-sm"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></svg>{{t.retry}}</button>
      </div>
    </sc-if>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"lang":{"editor":"enum","options":["en","ru"],"default":"en"},"status":{"editor":"enum","options":["data","loading","empty","error"],"default":"data"},"lite":{"editor":"boolean","default":false},"stage":{"editor":"boolean","default":true},"$preview":{"width":468,"height":440}}'>
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    const lang = p.lang === 'ru' ? 'ru' : 'en';
    const theme = p.theme === 'dark' ? 'dark' : 'light';
    const stage = p.stage !== false;
    const status = ['loading', 'empty', 'error'].includes(p.status) ? p.status : 'data';
    const T = {
      en: {
        title: 'Idea of the day', meta: 'Captured 12 days ago', refresh: 'Refresh idea', loading: 'Loading idea',
        idea: 'Research how Apple Shortcuts can push reminders to an API',
        sugg: 'You’re free 14:00–16:00 — maybe dig into this?',
        later: 'Not now', done: 'Done',
        emptyT: 'Capture your first idea',
        emptyS: 'Type it in the bar above, or send it from Notes with the “Send to daybrief” Shortcut.',
        errT: 'Couldn’t refresh', errS: 'Check your connection and try again.', retry: 'Try again'
      },
      ru: {
        title: 'Идея дня', meta: 'Записана 12 дней назад', refresh: 'Обновить идею', loading: 'Загружаю идею',
        idea: 'Разобраться, как Apple Shortcuts отправляют напоминания в API',
        sugg: 'У тебя свободно 14:00–16:00 — может, поисследовать?',
        later: 'Не сейчас', done: 'Готово',
        emptyT: 'Запиши первую идею',
        emptyS: 'Набери её в строке выше или отправь из Заметок через команду «Send to daybrief».',
        errT: 'Не удалось обновить', errS: 'Проверь соединение и попробуй ещё раз.', retry: 'Повторить'
      }
    }[lang];
    return {
      t: T,
      isData: status === 'data', isLoading: status === 'loading', isEmpty: status === 'empty', isError: status === 'error',
      spinCls: status === 'loading' ? 'spin' : '',
      rootCls: 'dbf th-' + theme + (p.lite === true ? ' lite' : '') + (stage ? ' scn sc-morning' : ''),
      rootStyle: stage ? 'padding:24px' : 'height:100%'
    };
  }
}
</script>
</body>
</html>
