<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Day brief widget</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./daybrief.css">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700&display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div class="{{rootCls}}" style="{{rootStyle}}">
  <sc-if value="{{show}}" hint-placeholder-val="{{ true }}">
    <section class="card w" aria-labelledby="sum-h">
      <div class="wh">
        <span class="wi"><svg class="ic ic-lg" viewBox="0 0 24 24" aria-hidden="true"><path d="M9.937 15.5A2 2 0 0 0 8.5 14.063l-6.135-1.582a.5.5 0 0 1 0-.962L8.5 9.936A2 2 0 0 0 9.937 8.5l1.582-6.135a.5.5 0 0 1 .963 0L14.063 8.5A2 2 0 0 0 15.5 9.937l6.135 1.581a.5.5 0 0 1 0 .964L15.5 14.063a2 2 0 0 0-1.437 1.437l-1.582 6.135a.5.5 0 0 1-.963 0z"/><path d="M20 3v4"/><path d="M22 5h-4"/></svg></span>
        <h2 class="wt" id="sum-h">{{t.title}}</h2>
        <span class="wm">{{t.updated}}</span>
        <button class="ib {{spinCls}}" aria-label="{{t.refresh}}"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></svg></button>
      </div>
      <sc-if value="{{isLoading}}" hint-placeholder-val="{{ false }}">
        <div style="display:flex;flex-direction:column;gap:12px;padding:6px 0 4px" aria-busy="true" aria-label="{{t.loading}}">
          <span class="sk" style="height:24px;width:96%"></span>
          <span class="sk" style="height:24px;width:88%"></span>
          <span class="sk" style="height:24px;width:54%"></span>
        </div>
      </sc-if>
      <sc-if value="{{isData}}" hint-placeholder-val="{{ true }}">
        <p class="sum-text">{{t.text}}</p>
      </sc-if>
    </section>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"lang":{"editor":"enum","options":["en","ru"],"default":"en"},"status":{"editor":"enum","options":["data","loading","error"],"default":"data"},"lite":{"editor":"boolean","default":false},"stage":{"editor":"boolean","default":true},"$preview":{"width":468,"height":340}}'>
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    const lang = p.lang === 'ru' ? 'ru' : 'en';
    const theme = p.theme === 'dark' ? 'dark' : 'light';
    const stage = p.stage !== false;
    const status = ['loading', 'error'].includes(p.status) ? p.status : 'data';
    const T = {
      en: {
        title: 'Day brief', updated: 'Generated 07:30', refresh: 'Refresh day brief', loading: 'Writing your day brief',
        text: 'Four meetings today, the first at 10:00 — the design review. Two important emails are waiting for your reply, and you are free from 14:00 to 16:00.'
      },
      ru: {
        title: 'Сводка дня', updated: 'Собрана в 07:30', refresh: 'Обновить сводку дня', loading: 'Пишу сводку дня',
        text: 'Сегодня четыре встречи, первая в 10:00 — дизайн-ревью. Два важных письма ждут ответа, а с 14:00 до 16:00 у тебя свободно.'
      }
    }[lang];
    return {
      t: T,
      show: status !== 'error',
      isLoading: status === 'loading',
      isData: status === 'data',
      spinCls: status === 'loading' ? 'spin' : '',
      rootCls: 'dbf th-' + theme + (p.lite === true ? ' lite' : '') + (stage ? ' scn sc-morning' : ''),
      rootStyle: stage ? 'padding:24px' : ''
    };
  }
}
</script>
</body>
</html>
