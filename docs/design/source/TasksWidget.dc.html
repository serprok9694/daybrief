<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tasks widget</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./daybrief.css">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700&display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div class="{{rootCls}}" style="{{rootStyle}}">
  <section class="card w" style="height:100%" aria-labelledby="tk-h">
    <div class="wh">
      <span class="wi"><svg class="ic ic-lg" viewBox="0 0 24 24" aria-hidden="true"><path d="m3 17 2 2 4-4"/><path d="m3 7 2 2 4-4"/><path d="M13 6h8"/><path d="M13 12h8"/><path d="M13 18h8"/></svg></span>
      <h2 class="wt" id="tk-h">{{t.title}}</h2>
      <span class="wm">{{t.updated}}</span>
      <button class="ib {{spinCls}}" aria-label="{{t.refresh}}"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></svg></button>
    </div>

    <sc-if value="{{isData}}" hint-placeholder-val="{{ true }}">
      <div class="wl">
        <p class="gl">{{t.overdue}}</p>
        <ul class="wl">
          <sc-for list="{{overdue}}" as="k" hint-placeholder-count="2">
            <li>
              <a class="li" href="#">
                <span class="mk" style="color:var(--accent)"><b style="background:var(--accent)"></b></span>
                <div class="li-body">
                  <div class="li-t">{{k.title}}</div>
                  <div style="margin-top:4px"><span class="chip chip-a"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>{{k.late}}</span></div>
                </div>
                <svg class="ic open" viewBox="0 0 24 24" role="img" aria-label="{{t.open}}"><path d="M7 7h10v10"/><path d="M7 17 17 7"/></svg>
              </a>
            </li>
          </sc-for>
        </ul>
        <p class="gl" style="margin-top:6px">{{t.today}}</p>
        <ul class="wl">
          <sc-for list="{{today}}" as="k" hint-placeholder-count="3">
            <li>
              <a class="li" href="#">
                <span class="mk"><b></b></span>
                <div class="li-body"><div class="li-t">{{k.title}}</div></div>
                <svg class="ic open" viewBox="0 0 24 24" role="img" aria-label="{{t.open}}"><path d="M7 7h10v10"/><path d="M7 17 17 7"/></svg>
              </a>
            </li>
          </sc-for>
        </ul>
        <button class="btn btn-g btn-sm more">{{t.more}}<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button>
      </div>
    </sc-if>

    <sc-if value="{{isLoading}}" hint-placeholder-val="{{ false }}">
      <div style="display:flex;flex-direction:column;gap:20px;padding:6px 12px" aria-busy="true" aria-label="{{t.loading}}">
        <sc-for list="{{skRows}}" as="r" hint-placeholder-count="5">
          <div style="display:flex;gap:14px;align-items:center">
            <span class="sk sk-c" style="width:10px;height:10px"></span>
            <span class="sk" style="height:16px;width:{{r.w}}"></span>
          </div>
        </sc-for>
      </div>
    </sc-if>

    <sc-if value="{{isEmpty}}" hint-placeholder-val="{{ false }}">
      <div class="emp">
        <span class="emp-i"><svg class="ic ic-xl" viewBox="0 0 24 24" aria-hidden="true"><path d="m3 17 2 2 4-4"/><path d="m3 7 2 2 4-4"/><path d="M13 6h8"/><path d="M13 12h8"/><path d="M13 18h8"/></svg></span>
        <p class="emp-t">{{t.emptyT}}</p>
      </div>
    </sc-if>

    <sc-if value="{{isError}}" hint-placeholder-val="{{ false }}">
      <div class="emp">
        <span class="emp-i"><svg class="ic ic-xl" viewBox="0 0 24 24" aria-hidden="true"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg></span>
        <p class="emp-t">{{t.errT}}</p>
        <p class="emp-s">{{t.errS}}</p>
        <button class="btn btn-s btn-sm"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></svg>{{t.retry}}</button>
      </div>
    </sc-if>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"lang":{"editor":"enum","options":["en","ru"],"default":"en"},"status":{"editor":"enum","options":["data","loading","empty","error"],"default":"data"},"lite":{"editor":"boolean","default":false},"stage":{"editor":"boolean","default":true},"$preview":{"width":468,"height":600}}'>
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    const lang = p.lang === 'ru' ? 'ru' : 'en';
    const theme = p.theme === 'dark' ? 'dark' : 'light';
    const stage = p.stage !== false;
    const status = ['loading', 'empty', 'error'].includes(p.status) ? p.status : 'data';
    const T = {
      en: {
        title: 'Tasks', updated: 'Updated 2 min ago', refresh: 'Refresh tasks', loading: 'Loading tasks',
        overdue: 'Overdue', today: 'Today', more: 'Show 2 more', open: 'Open in Google Tasks',
        emptyT: 'No tasks for today',
        errT: 'Couldn’t refresh', errS: 'Check your connection and try again.', retry: 'Try again',
        overdueList: [{ title: 'Send the invoice to the client', late: 'Overdue · 2 days' }, { title: 'Renew the domain', late: 'Overdue · 1 day' }],
        todayList: [{ title: 'Review pull request #128' }, { title: 'Prepare notes for the design review' }, { title: 'Book a dentist appointment' }]
      },
      ru: {
        title: 'Задачи', updated: 'Обновлено 2 мин назад', refresh: 'Обновить задачи', loading: 'Загружаю задачи',
        overdue: 'Просрочено', today: 'Сегодня', more: 'Показать ещё 2', open: 'Открыть в Google Задачах',
        emptyT: 'Задач на сегодня нет',
        errT: 'Не удалось обновить', errS: 'Проверь соединение и попробуй ещё раз.', retry: 'Повторить',
        overdueList: [{ title: 'Отправить счёт клиенту', late: 'Просрочено · 2 дн.' }, { title: 'Продлить домен', late: 'Просрочено · 1 дн.' }],
        todayList: [{ title: 'Проверить pull request #128' }, { title: 'Подготовить заметки к дизайн-ревью' }, { title: 'Записаться к стоматологу' }]
      }
    }[lang];
    return {
      t: T, overdue: T.overdueList, today: T.todayList,
      skRows: [{ w: '72%' }, { w: '58%' }, { w: '80%' }, { w: '64%' }, { w: '50%' }],
      isData: status === 'data', isLoading: status === 'loading', isEmpty: status === 'empty', isError: status === 'error',
      spinCls: status === 'loading' ? 'spin' : '',
      rootCls: 'dbf th-' + theme + (p.lite === true ? ' lite' : '') + (stage ? ' scn sc-morning' : ''),
      rootStyle: stage ? 'padding:24px' : 'height:100%'
    };
  }
}
</script>
</body>
</html>
